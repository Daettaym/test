<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>⚠️ WARNING ⚠️</title>
    <style>
        body {
            background-color: black;
            color: red;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-shadow: 2px 2px 5px red;
        }

        /* تأثير التشويش */
        .glitch {
            font-size: 50px;
            font-weight: bold;
            animation: noise 0.2s infinite;
        }

        @keyframes noise {
            0% { transform: translate(2px, 1px) rotate(0deg); background: rgba(255,0,0,0.1); }
            20% { transform: translate(-1px, -2px) rotate(-1deg); }
            40% { transform: translate(-3px, 0px) rotate(1deg); }
            60% { transform: translate(3px, 2px) rotate(0deg); }
            80% { transform: translate(1px, -1px) rotate(1deg); }
            100% { transform: translate(-1px, 2px) rotate(-1deg); }
        }
    </style>
</head>
<body>

    <div class="glitch">SYSTEM FAILURE</div>

    <script>
        // دالة لتشغيل صوت الطنين (Oscillator)
        function playBuzzer() {
            const context = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = context.createOscillator();
            oscillator.type = 'sawtooth'; // صوت حاد ومزعج
            oscillator.frequency.setValueAtTime(440, context.currentTime); 
            oscillator.connect(context.destination);
            oscillator.start();
            
            // يتوقف الصوت بعد 3 ثواني
            setTimeout(() => { oscillator.stop(); }, 3000);
        }

        // تبدأ التنبيهات مع الصوت
        window.onload = function() {
            // ملاحظة: المتصفحات تمنع الصوت التلقائي أحياناً إلا لو ضغط المستخدم على الشاشة
            playBuzzer();
            
            alert("⚠️ WARNING: Malware detected!");
            alert("🛑 جاري الوصول إلى سجل المكالمات والصور...");
            alert("📁 تم تشفير جميع ملفات النظام!");
            alert("💀 وداعاً.. تم سحب بياناتك بالكامل.");
        };
    </script>
</body>
</html>
