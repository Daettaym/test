<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FATAL_SYSTEM_ERROR_0x666</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: black; overflow: hidden; font-family: monospace;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }

        /* حاويات الشاشة المقسمة */
        .layer {
            position: fixed; width: 100%; height: 100%; top: 0; left: 0;
            display: none; z-index: 1;
        }

        /* 1. مطر الأكواد (الماتريكس) */
        #matrix-layer { display: block; background: black; }
        canvas { display: block; }

        /* 2. تشويش أبيض وأسود */
        #static-layer {
            background: url('https://upload.wikimedia.org/wikipedia/commons/5/5a/Static_noise.gif');
            background-size: cover; opacity: 0.8;
        }

        /* 3. نصوص قوس قزح المتحركة */
        #rainbow-layer {
            background: black;
            display: flex; justify-content: center; align-items: center;
            flex-direction: column;
        }
        .rainbow-text {
            font-size: 50px; font-weight: bold; text-align: center;
            animation: rainbow-cycle 0.1s infinite, shake 0.05s infinite;
        }

        @keyframes rainbow-cycle {
            0% { color: red; } 20% { color: yellow; } 40% { color: lime; }
            60% { color: cyan; } 80% { color: magenta; } 100% { color: red; }
        }

        @keyframes shake {
            0% { transform: translate(0,0); }
            50% { transform: translate(-10px, 10px); }
            100% { transform: translate(10px, -10px); }
        }

        /* الشقوق (دائماً في الأعلى) */
        #crack {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://i.imgur.com/8W7X9vH.png');
            background-size: cover; z-index: 9999; pointer-events: none; display: none;
        }
    </style>
</head>
<body onclick="startChaos()">

    <div id="crack"></div>

    <div id="matrix-layer" class="layer"><canvas id="q"></canvas></div>
    <div id="static-layer" class="layer"></div>
    <div id="rainbow-layer" class="layer">
        <div class="rainbow-text">SYSTEM BREACHED</div>
        <div class="rainbow-text" style="font-size: 20px;">DUMPING_PRIVATE_DATA_010101</div>
    </div>

    <div id="init-msg" style="color:white; text-align:center; padding-top:40vh; z-index:10000; position:relative;">
        <h1>⚠️ تم اكتشاف محاولة اختراق</h1>
        <p>انقر لتشغيل نظام الحماية الفوري</p>
    </div>

    <script>
        // كود مطر الأكواد (Matrix)
        var s = window.screen;
        var width = q.width = s.width;
        var height = q.height = s.height;
        var letters = Array(256).join(1).split('');
        var draw = function () {
            q.getContext('2d').fillStyle = 'rgba(0,0,0,.05)';
            q.getContext('2d').fillRect(0,0,width,height);
            q.getContext('2d').fillStyle = '#0F0';
            letters.map(function(y_pos, index){
                text = String.fromCharCode(3e4+Math.random()*33);
                x_pos = index * 10;
                q.getContext('2d').fillText(text, x_pos, y_pos);
                letters[index] = (y_pos > 758 + Math.random() * 1e4) ? 0 : y_pos + 10;
            });
        };

        function startChaos() {
            document.getElementById('init-msg').style.display = 'none';
            document.getElementById('crack').style.display = 'block';
            document.body.style.pointerEvents = "none"; // تعطيل اللمس

            // تشغيل المطر
            setInterval(draw, 33);

            // تبديل الأدوار كل ثانية
            const layers = [
                document.getElementById('matrix-layer'),
                document.getElementById('static-layer'),
                document.getElementById('rainbow-layer')
            ];

            let current = 0;
            setInterval(() => {
                layers.forEach(l => l.style.display = 'none');
                layers[current].style.display = 'block';
                current = (current + 1) % layers.length;
                
                // اهتزاز عشوائي
                if (navigator.vibrate) navigator.vibrate(200);
            }, 1000);

            // صوت مزعج جداً (طنين وترددات متغيرة)
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            
            setInterval(() => {
                osc.frequency.value = Math.random() * 500 + 100;
            }, 100);

            // منع الرجوع
            window.history.pushState(null, null, window.location.href);
            window.onpopstate = function() { window.history.go(1); };
        }
    </script>
</body>
</html>
