<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚨 CRITICAL_SYSTEM_FAILURE_0x777</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: black; overflow: hidden; font-family: 'Courier New', monospace;
            color: #0f0; /* تثبيت اللون الأخضر */
            touch-action: none; user-select: none; -webkit-user-select: none;
        }

        /* حاويات الشاشة المقسمة */
        .layer {
            position: fixed; width: 100%; height: 100%; top: 0; left: 0;
            display: none; z-index: 1; border: 2px solid #0f0;
        }

        /* 1. مطر الأكواد (Matrix) */
        #matrix-layer { display: block; }
        canvas { display: block; filter: brightness(1.2); }

        /* 2. الشبكة العصبية الهندسية */
        #network-layer { background: black; }

        /* 3. نافذة الأوامر ولوق الأخطاء */
        #console-layer {
            background: rgba(0, 20, 0, 0.9);
            display: flex; flex-direction: column; padding: 10px;
            box-sizing: border-box; font-size: 14px; line-height: 1.4;
        }
        .console-header {
            border-bottom: 2px solid #0f0; padding-bottom: 5px; margin-bottom: 10px;
            font-weight: bold; text-transform: uppercase; text-align: center;
        }
        .critical { color: red; animation: blink 0.5s infinite; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* شقوق الشاشة (دائماً في الأعلى) */
        #crack {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://i.imgur.com/8W7X9vH.png');
            background-size: cover; z-index: 9999; pointer-events: none; display: none;
            filter: invert(1) hue-rotate(90deg); /* جعل الشقوق خضراء */
        }
    </style>
</head>
<body onclick="startChaos()">

    <div id="crack"></div>

    <div id="matrix-layer" class="layer"><canvas id="q"></canvas></div>
    
    <div id="network-layer" class="layer">
        <svg width="100%" height="100%" style="opacity: 0.8">
            <g stroke="#0f0" stroke-width="1.5">
                <circle cx="50" cy="50" r="5" fill="#0f0"/>
                <circle cx="150" cy="150" r="5" fill="#0f0"/>
                <circle cx="250" cy="250" r="5" fill="#0f0"/>
                <circle cx="100" cy="300" r="5" fill="#0f0"/>
                <circle cx="300" cy="100" r="5" fill="#0f0"/>
                <line x1="50" y1="50" x2="150" y2="150" />
                <line x1="150" y1="150" x2="250" y2="250" />
                <line x1="150" y1="150" x2="100" y2="300" />
                <line x1="250" y1="250" x2="300" y2="100" />
                <line x1="50" y1="50" x2="300" y2="100" animation="pulse 2s infinite" />
            </g>
        </svg>
    </div>

    <div id="console-layer" class="layer">
        <div class="console-header">Root Access: Terminated</div>
        <div id="console-log">
            > Initializing bypass... [FAILED]<br>
            > Accessing /user/private... [DENIED]<br>
            > Attempting kernel override...<br>
            <span class="critical">CRITICAL_ERROR: 0x88042</span><br>
            > Dumping System32 drivers...
        </div>
    </div>

    <div id="init-msg" style="color:#0f0; text-align:center; padding-top:40vh; z-index:10000; position:relative;">
        <h1>⚠️ تم اكتشاف محاولة وصول</h1>
        <p>انقر لتفعيل نظام الحماية الفوري</p>
    </div>

    <script>
        // كود مطر الأكواد (Matrix)
        var s = window.screen;
        var width = q.width = s.width;
        var height = q.height = s.height;
        var letters = Array(256).join(1).split('');
        var draw = function () {
            q.getContext('2d').fillStyle = 'rgba(0,0,0,.05)';
            q.getContext('2d').fillRect(0,0,width,height);
            q.getContext('2d').fillStyle = '#0F0'; /* لون المطر أخضر */
            letters.map(function(y_pos, index){
                text = String.fromCharCode(1e2+Math.random()*33);
                x_pos = index * 10;
                q.getContext('2d').fillText(text, x_pos, y_pos);
                letters[index] = (y_pos > 758 + Math.random() * 1e4) ? 0 : y_pos + 10;
            });
        };

        const errors = [
            "ERROR: Buffer overflow",
            "WARNING: Remote access detected",
            "CRITICAL: CPU Core #3 offline",
            "DUMP: /DCIM/Camera/ copied to remote",
            "FAILED: Integrity check!",
            "Kernel panic!"
        ];

        function startChaos() {
            document.getElementById('init-msg').style.display = 'none';
            document.getElementById('crack').style.display = 'block';
            document.body.style.pointerEvents = "none"; // تعطيل اللمس

            // تشغيل المطر
            setInterval(draw, 33);

            // إضافة لوقات أخطاء للكونسول
            setInterval(() => {
                const log = document.getElementById('console-log');
                const line = document.createElement('div');
                line.innerHTML = `> ${errors[Math.floor(Math.random()*errors.length)]}`;
                if(Math.random() > 0.7) line.className = 'critical';
                log.appendChild(line);
                if(log.children.length > 20) log.removeChild(log.firstChild);
                log.parentElement.scrollTop = log.parentElement.scrollHeight;
            }, 300);

            // تبديل الأدوار كل ثانية (تقليب الشاشة)
            const layers = [
                document.getElementById('matrix-layer'),
                document.getElementById('network-layer'),
                document.getElementById('console-layer')
            ];

            let current = 0;
            setInterval(() => {
                layers.forEach(l => l.style.display = 'none');
                layers[current].style.display = 'block';
                current = (current + 1) % layers.length;
                
                // اهتزاز الجوال
                if (navigator.vibrate) navigator.vibrate(200);
            }, 1000);

            // 🔊 صوت إنذار طوارئ حقيقي (EAS Alert)
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            osc.type = 'sawtooth'; // صوت حاد
            osc.frequency.value = 440; // نغمة حادة واحدة مستمرة
            osc.connect(audioCtx.destination);
            osc.start();
            
            // جعل الصوت يقطع (Beep Beep)
            setInterval(() => {
                if(osc.frequency.value === 440) osc.frequency.value = 0;
                else osc.frequency.value = 440;
            }, 500);

            // منع زر الرجوع
            window.history.pushState(null, null, window.location.href);
            window.onpopstate = function() { window.history.go(1); };
        }
    </script>
</body>
</html>
