<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYSTEM_CRITICAL_FAILURE</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: black; overflow: hidden; font-family: monospace;
            touch-action: none;
        }

        /* شقوق الشاشة - صورة بديلة ومؤكدة */
        #crack {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/cracked-glass.png'), 
                        url('https://pngimg.com/uploads/broken_glass/broken_glass_PNG30.png');
            background-size: cover; z-index: 10000; pointer-events: none; display: none;
            filter: invert(1);
        }

        .layer { position: fixed; width: 100%; height: 100%; top: 0; left: 0; display: none; z-index: 1; }

        /* مطر الأكواد */
        #matrix-layer { display: block; background: black; }
        canvas { display: block; filter: brightness(1.5); }

        /* تشويش أبيض وأسود */
        #static-layer {
            background: url('https://media.giphy.com/media/oEI9uWUicKgS2UzSsw/giphy.gif');
            background-size: cover; opacity: 0.8;
        }

        /* نصوص قوس قزح */
        #rainbow-layer {
            background: black; display: flex; justify-content: center; align-items: center; flex-direction: column;
        }
        .rainbow-text {
            font-size: 40px; font-weight: bold; text-align: center;
            animation: rainbow 0.1s infinite, shake 0.05s infinite;
        }

        @keyframes rainbow {
            0% { color: #ff0000; } 25% { color: #00ff00; } 50% { color: #0000ff; } 75% { color: #ffff00; } 100% { color: #ff00ff; }
        }

        @keyframes shake {
            0% { transform: translate(-10px, 5px); } 50% { transform: translate(10px, -5px); } 100% { transform: translate(-5px, 10px); }
        }
    </style>
</head>
<body onclick="launchChaos()">

    <div id="crack"></div>
    <div id="matrix-layer" class="layer"><canvas id="q"></canvas></div>
    <div id="static-layer" class="layer"></div>
    <div id="rainbow-layer" class="layer">
        <div class="rainbow-text">CORE_SYSTEM_FAILURE</div>
        <div class="rainbow-text" style="font-size: 15px;">WIPING_PRIVATE_STORAGE_88%</div>
    </div>

    <div id="start" style="color:white; text-align:center; padding-top:45vh; position:relative; z-index:10001;">
        <h2 style="color:red; animation: blink 0.5s infinite;">⚠️ SYSTEM ERROR</h2>
        <p>انقر لإصلاح أخطاء النظام</p>
    </div>

    <script>
        // Matrix Code
        var s = window.screen;
        var width = q.width = s.width;
        var height = q.height = s.height;
        var letters = Array(256).join(1).split('');
        var draw = function () {
            q.getContext('2d').fillStyle = 'rgba(0,0,0,.05)';
            q.getContext('2d').fillRect(0,0,width,height);
            q.getContext('2d').fillStyle = '#0F0';
            letters.map(function(y_pos, index){
                text = String.fromCharCode(1e2+Math.random()*33);
                q.getContext('2d').fillText(text, index * 10, y_pos);
                letters[index] = (y_pos > 758 + Math.random() * 1e4) ? 0 : y_pos + 10;
            });
        };

        function launchChaos() {
            document.getElementById('start').style.display = 'none';
            document.getElementById('crack').style.display = 'block';
            document.body.style.pointerEvents = "none"; 
            setInterval(draw, 33);

            const layers = [
                document.getElementById('matrix-layer'),
                document.getElementById('static-layer'),
                document.getElementById('rainbow-layer')
            ];

            let i = 0;
            setInterval(() => {
                layers.forEach(l => l.style.display = 'none');
                layers[i].style.display = 'block';
                i = (i + 1) % layers.length;
                if (navigator.vibrate) navigator.vibrate(100);
            }, 800); // تبديل كل أقل من ثانية لزيادة الرعب

            // صوت طنين إلكتروني مزعج جداً
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            setInterval(() => { osc.frequency.value = Math.random() * 800 + 200; }, 50);
        }
    </script>
</body>
</html>
