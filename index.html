<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>⚠️ WARNING ⚠️</title>
    <style>
        body {
            background-color: black;
            color: white;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* هذا هو تأثير "تطفي وتشتغل" باللون الأحمر */
        .emergency-mode {
            animation: flash 0.1s infinite;
        }

        @keyframes flash {
            0% { background-color: black; }
            50% { background-color: red; }
            100% { background-color: black; }
        }

        .text {
            font-size: 40px;
            font-weight: bold;
            text-align: center;
            z-index: 10;
            text-shadow: 0 0 10px #000;
        }
    </style>
</head>
<body id="bg">

    <div class="text" id="msg">SYSTEM FAILURE</div>

    <script>
        window.onload = function() {
            // أول ما تظهر الرسالة، تبدأ الشاشة "تطفي وتشتغل" خلف الكواليس
            document.getElementById('bg').classList.add('emergency-mode');
            document.getElementById('msg').innerText = "⚠️ SYSTEM HACKED ⚠️";

            alert("🚨 تهديد أمني: تم اختراق ملفات النظام!");
            alert("🔥 تحذير: المعالج وصل لدرجة حرارة خطيرة!");
            alert("📱 جاري مسح جميع الصور والمحادثات...");
            alert("💀 تمت العملية بنجاح. وداعاً!");
        };
    </script>
</body>
</html>
